[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raggate"
version = "0.1.0"
description = "A RAG index must pass a retrieval gate before it is allowed to serve"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
obs = ["braintrust"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
